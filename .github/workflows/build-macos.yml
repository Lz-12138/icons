name: Build macOS .app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 也可以在网页上手动点「Run workflow」

env:
  APP_NAME: IconStudio # ← 和 build/app.spec 里的 APP_NAME 保持一致
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple 芯片 arm64
            arch: arm64
          - runner: macos-15-intel # Intel x86_64（macos-13 已被 GitHub 退役）
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 构建 .app
        run: bash build/build-macos.sh

      - name: 打包 zip（ditto 能保留可执行位和签名信息，别用普通 zip）
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ env.APP_NAME }}.app" \
            "artifact/${{ env.APP_NAME }}-${{ matrix.arch }}.zip"
          ls -lh artifact

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.arch }}
          path: artifact/*.zip
          if-no-files-found: error

